<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#0A171E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="apple-touch-icon" href="apple-touch-icon.png">

<title>Riff-Logbuch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: Logbuch eines Riffbeckens – Kopf mit Systemdaten, Reiterleiste, darunter gestapelte Arbeitsflächen; aktinisches Blau als einziger Akzent */
:root{
  --bg:#EDF2F3; --surface:#FFFFFF; --surface-2:#E2E9EB; --ink:#10262E; --muted:#566C74; --line:#CAD6DA;
  --actinic:#4448CF; --actinic-ink:#FFFFFF; --actinic-soft:#E4E5FA; --band:rgba(68,72,207,.10);
  --ok:#1D8556; --ok-soft:#DCF0E5; --warn:#A86C12; --warn-soft:#F6EAD3; --crit:#BD3A34; --crit-soft:#F6DCDA;
  --font-display:"Familjen Grotesk","Segoe UI",system-ui,sans-serif;
  --font-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A171E; --surface:#10222B; --surface-2:#172E39; --ink:#E1ECEF; --muted:#90A7AF; --line:#22404B;
  --actinic:#9093FF; --actinic-ink:#0A0F2E; --actinic-soft:#22254D; --band:rgba(144,147,255,.14);
  --ok:#4CC08A; --ok-soft:#14352A; --warn:#E2A548; --warn-soft:#382B13; --crit:#F0716A; --crit-soft:#3D1C1A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A171E; --surface:#10222B; --surface-2:#172E39; --ink:#E1ECEF; --muted:#90A7AF; --line:#22404B;
  --actinic:#9093FF; --actinic-ink:#0A0F2E; --actinic-soft:#22254D; --band:rgba(144,147,255,.14);
  --ok:#4CC08A; --ok-soft:#14352A; --warn:#E2A548; --warn-soft:#382B13; --crit:#F0716A; --crit-soft:#3D1C1A; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:8px 16px;padding-block:20px 12px}
.brand h1{font-family:var(--font-display);font-weight:700;font-size:1.75rem;letter-spacing:-.01em;margin:0;line-height:1.1}
.brand p{margin:2px 0 0;color:var(--muted);font-size:.92rem}
.status{font:inherit;font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px;background:none;border:0;padding:4px 0;cursor:pointer;text-align:left}
.status:hover #status-t{text-decoration:underline}
.steps{padding-left:20px;display:flex;flex-direction:column;gap:8px;max-width:75ch;font-size:.92rem;margin:8px 0 0}
.status .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.ok .dot{background:var(--ok)} .status.warn .dot{background:var(--warn)} .status.crit .dot{background:var(--crit)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin-bottom:16px}
nav.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:0;background:none;color:var(--muted);font:600 .92rem var(--font-body);padding:10px 12px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--actinic)}
.tab:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,.card:focus-visible{outline:2px solid var(--actinic);outline-offset:2px}
.stack{display:flex;flex-direction:column;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.ph{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 12px;margin-bottom:12px}
.ph h2{font-family:var(--font-display);font-weight:600;font-size:1.15rem;margin:0;text-wrap:balance}
.ph .sub{color:var(--muted);font-size:.85rem}
h3{font-family:var(--font-display);font-weight:600;font-size:1rem;margin:14px 0 8px}
.hint{color:var(--muted);font-size:.85rem;margin:8px 0 0;max-width:72ch}
.mono,.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px 12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f>span{font-size:.8rem;font-weight:600;color:var(--muted);letter-spacing:.01em}
.f>span em{font-style:normal;font-weight:400}
.f.wide{grid-column:1/-1}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:7px 9px;min-width:0;width:100%}
input.num{text-align:right}
input[type=checkbox]{width:auto}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;grid-column:1/-1}
.btn{font:600 .9rem var(--font-body);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;padding:8px 14px;cursor:pointer}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--actinic);border-color:var(--actinic);color:var(--actinic-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:4px 9px;font-size:.8rem}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;color:var(--actinic);font:inherit;font-weight:600;cursor:pointer;padding:0}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.crit{background:var(--crit-soft);color:var(--crit)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.card{text-align:left;font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:6px;cursor:pointer;min-width:0;position:relative;overflow:hidden}
.card[aria-pressed="true"]{border-color:var(--actinic);box-shadow:inset 0 0 0 1px var(--actinic)}
.card .name{font-size:.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.card .val{font-family:var(--font-mono);font-size:1.45rem;font-weight:600;line-height:1}
.card .val small{font-family:var(--font-body);font-size:.78rem;color:var(--muted);font-weight:600;margin-left:3px}
.card .meta{font-size:.78rem;color:var(--muted)}
.card svg{display:block;width:100%;height:28px}
.card .stripe{position:absolute;left:0;top:0;bottom:0;width:3px;background:transparent}
.card.st-ok .stripe{background:var(--ok)} .card.st-warn .stripe{background:var(--warn)} .card.st-crit .stripe{background:var(--crit)}
.due{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.due-item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 11px;border-radius:8px;background:var(--surface-2);font-size:.9rem;min-width:0}
.due-item b{font-weight:600}
.due-item .when{font-size:.8rem;color:var(--muted);white-space:nowrap}
.due-item.crit{background:var(--crit-soft)} .due-item.crit .when{color:var(--crit);font-weight:700}
.due-item.warn{background:var(--warn-soft)} .due-item.warn .when{color:var(--warn);font-weight:700}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{font:600 .8rem var(--font-body);border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;padding:4px 10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--actinic-soft);border-color:var(--actinic);color:var(--ink)}
.chart{width:100%;min-height:120px}
.chart svg{display:block}
.chart text{font-family:var(--font-mono);font-size:11px;fill:var(--muted)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
th{font-size:.74rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;background:var(--surface-2);position:sticky;top:0}
td{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
th:first-child{background:var(--surface-2);z-index:2}
td.txt,th.txt{text-align:left;font-family:var(--font-body);white-space:normal;min-width:140px}
tr:last-child td{border-bottom:0}
tr.grp td{background:var(--surface-2);font-family:var(--font-body);font-weight:700;font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
td .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:5px;vertical-align:middle}
.d-ok{background:var(--ok)} .d-warn{background:var(--warn)} .d-crit{background:var(--crit)}
td input{width:88px;padding:4px 6px;font-family:var(--font-mono);font-size:.85rem}
td.hl{background:var(--actinic-soft);font-weight:600}
.note{font-family:var(--font-body);font-size:.8rem;white-space:normal;text-align:left;color:var(--warn);min-width:180px}
.note.crit{color:var(--crit)}
.empty{color:var(--muted);padding:18px;text-align:center;border:1px dashed var(--line);border-radius:8px;margin:0}
.mix{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.mixcol{border:1px solid var(--line);border-radius:8px;padding:12px}
.mixcol h3{margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.mixrow{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line);font-size:.92rem}
.mixrow:last-child{border-bottom:0}
.mixrow .mono{font-weight:600}
.mixrow.ro{color:var(--muted)}
.mixrow.sum{border-top:1px solid var(--ink);border-bottom:0;font-weight:700;margin-top:4px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.9rem;align-items:baseline}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-family:var(--font-mono);text-align:right}
.res{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.res div{background:var(--surface-2);border-radius:8px;padding:10px}
.res span{display:block;font-size:.76rem;color:var(--muted);font-weight:600}
.res b{font-family:var(--font-mono);font-size:1.1rem;font-weight:600}
.res .big{background:var(--actinic-soft)}
.banner{background:var(--warn-soft);color:var(--ink);border-radius:8px;padding:10px 12px;font-size:.9rem}
details>summary{cursor:pointer;font-weight:600;color:var(--actinic);margin:4px 0}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:.88rem;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.loading{color:var(--muted);padding:24px 0}
@media (max-width:520px){.brand h1{font-size:1.45rem}.panel{padding:13px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>Riff-Logbuch</h1>
      <p id="hdr-sub">Riffbecken · Systemvolumen netto 900 l</p>
    </div>
    <button class="status" id="status" data-act="goto" data-id="speichern" title="Sicherung und PDF"><span class="dot"></span><span id="status-t">Lädt …</span></button>
  </header>
  <nav class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-tab="uebersicht">Übersicht</button>
    <button class="tab" role="tab" data-tab="messungen">Messungen</button>
    <button class="tab" role="tab" data-tab="icp">ICP</button>
    <button class="tab" role="tab" data-tab="spuren">Spurenelemente</button>
    <button class="tab" role="tab" data-tab="dosierung">KH · Ca · Mg</button>
    <button class="tab" role="tab" data-tab="rechner">Salz &amp; Volumen</button>
    <button class="tab" role="tab" data-tab="ziele">Zielwerte</button>
    <button class="tab" role="tab" data-tab="speichern">Sichern &amp; PDF</button>
  </nav>
  <main id="main"><p class="loading">Lade dein Logbuch …</p></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
/* ---------- Stammdaten ---------- */
const PARAMS=[
 {k:'kh',n:'KH',u:'°dKH',d:1,def:[7,8,9],iv:3},
 {k:'ca',n:'Calcium',u:'mg/l',d:0,def:[400,420,450],iv:7},
 {k:'mg',n:'Magnesium',u:'mg/l',d:0,def:[1250,1320,1420],iv:0},
 {k:'no3',n:'Nitrat',u:'mg/l',d:1,def:[2,5,15],iv:7},
 {k:'po4',n:'Phosphat',u:'mg/l',d:3,def:[0.02,0.05,0.1],iv:7},
 {k:'sal',n:'Salinität',u:'‰',d:1,def:[34,35,35.5],iv:7},
 {k:'ph',n:'pH',u:'',d:2,def:[7.9,8.2,8.4],iv:0},
 {k:'temp',n:'Temperatur',u:'°C',d:1,def:[24.5,25.5,26.5],iv:0}
];
const PMAP=Object.fromEntries(PARAMS.map(p=>[p.k,p]));
const EL=[
 {s:'Co',n:'Cobalt',u:'µg/l',g:'S',def:[0.7,1,1.3]},
 {s:'Ni',n:'Nickel',u:'µg/l',g:'S',def:[2.8,4,5.2]},
 {s:'Fe',n:'Eisen',u:'µg/l',g:'S',def:[0.7,1,1.3]},
 {s:'Mn',n:'Mangan',u:'µg/l',g:'S',def:[0.35,0.5,0.65]},
 {s:'Cu',n:'Kupfer',u:'µg/l',g:'S',def:[2.8,4,5.2]},
 {s:'Cr',n:'Chrom',u:'µg/l',g:'S',def:[0.7,1,1.3]},
 {s:'Zn',n:'Zink',u:'µg/l',g:'S',def:[2.8,4,5.2]},
 {s:'F',n:'Fluor',u:'mg/l',g:'S',def:[1.1,1.3,1.5]},
 {s:'I',n:'Iod',u:'µg/l',g:'S',def:[50,65,80]},
 {s:'V',n:'Vanadium',u:'µg/l',g:'S',def:[3.2,4.5,5.8]},
 {s:'Se',n:'Selen',u:'µg/l',g:'S',def:[2.5,3.5,4.5]},
 {s:'Mo',n:'Molybdän',u:'µg/l',g:'S',def:[8,12,20]},
 {s:'Li',n:'Lithium',u:'µg/l',g:'S',def:[150,180,250]},
 {s:'Ba',n:'Barium',u:'µg/l',g:'S',def:[5,15,25]},
 {s:'Na',n:'Natrium',u:'mg/l',g:'H',def:[10000,10780,11500]},
 {s:'Mg',n:'Magnesium',u:'mg/l',g:'H',def:[1250,1320,1420]},
 {s:'Ca',n:'Calcium',u:'mg/l',g:'H',def:[400,420,450]},
 {s:'K',n:'Kalium',u:'mg/l',g:'H',def:[380,400,420]},
 {s:'Sr',n:'Strontium',u:'mg/l',g:'H',def:[6.5,8,10]},
 {s:'B',n:'Bor',u:'mg/l',g:'H',def:[4,4.5,6]},
 {s:'Br',n:'Brom',u:'mg/l',g:'H',def:[60,67,80]},
 {s:'S',n:'Schwefel',u:'mg/l',g:'H',def:[850,900,980]},
 {s:'P',n:'Phosphor',u:'µg/l',g:'N',def:[10,20,40]},
 {s:'Si',n:'Silizium',u:'µg/l',g:'N',def:[0,100,500]},
 {s:'Al',n:'Aluminium',u:'µg/l',g:'X',def:[0,0,10]},
 {s:'Sn',n:'Zinn',u:'µg/l',g:'X',def:[0,0,2]},
 {s:'Pb',n:'Blei',u:'µg/l',g:'X',def:[0,0,1]}
];
const EMAP=Object.fromEntries(EL.map(e=>[e.s,e]));
const GROUPS={S:'Spurenelemente',H:'Hauptelemente',N:'Nährstoffe & Silikat',X:'Schadstoffe'};
const DEF_SPUREN={Co:{stamm:'K',konz:450},Ni:{stamm:'K',konz:350},Fe:{stamm:'K',konz:10000},Mn:{stamm:'K',konz:100000},Cu:{stamm:'K',konz:10000},Cr:{stamm:'K',konz:10000},Zn:{stamm:'K',konz:10000},F:{stamm:'A',konz:4500},I:{stamm:'A',konz:75000},V:{stamm:'A',konz:10000},Se:{stamm:'A',konz:4500}};
const ANION=new Set(['F','I','V','Se','Mo','B','Br']);
/* Wirkung je 1 g in 100 l */
const PRODUKTE={
 kh:[{id:'nahco3',n:'Natriumhydrogencarbonat (NaHCO₃)',e:0.3338},{id:'na2co3',n:'Natriumcarbonat, wasserfrei (Na₂CO₃)',e:0.5292},{id:'eigen',n:'Eigenes Produkt (Angabe vom Etikett)'}],
 ca:[{id:'cacl2',n:'Calciumchlorid-Dihydrat (CaCl₂·2H₂O)',e:2.726},{id:'eigen',n:'Eigenes Produkt (Angabe vom Etikett)'}],
 mg:[{id:'mgcl2',n:'Magnesiumchlorid-Hexahydrat (MgCl₂·6H₂O)',e:1.196},{id:'mgso4',n:'Magnesiumsulfat-Heptahydrat (MgSO₄·7H₂O)',e:0.986},{id:'eigen',n:'Eigenes Produkt (Angabe vom Etikett)'}]
};
const MAXTAG={kh:1,ca:20,mg:100};

function defCfg(){return{
 volumen:900,
 intervalle:Object.fromEntries(PARAMS.map(p=>[p.k,p.iv])),
 ziele:{},
 spuren:{mlProTag:9,tage:50,ausgleich:100,rundung:0.01,elemente:JSON.parse(JSON.stringify(DEF_SPUREN))},
 dos:{kh:{produkt:'nahco3',gpl:'',wirkung:'',tagesdosis:'',fenster:30,korrektur:7},
      ca:{produkt:'cacl2',gpl:'',wirkung:'',tagesdosis:'',fenster:30,korrektur:7},
      mg:{produkt:'mgcl2',gpl:'',wirkung:'',tagesdosis:'',fenster:60,korrektur:7}},
 salz:{gpl35:36},
 vol:{bL:'',bT:'',bH:'',tL:'',tT:'',tH:'',abzug:10}
}}

/* ---------- Helfer ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function num(v){if(v==null)return null;if(typeof v==='number')return isFinite(v)?v:null;const s=String(v).trim().replace(/\s/g,'').replace(',','.');if(s==='')return null;const n=Number(s);return isFinite(n)?n:null}
function fmt(v,d=1){if(v==null||!isFinite(v))return '–';return v.toLocaleString('de-DE',{minimumFractionDigits:d,maximumFractionDigits:d})}
function autoDec(v){const a=Math.abs(v);return a>=100?0:a>=10?1:a>=1?2:a>=0.1?3:4}
function fmtA(v){return v==null||!isFinite(v)?'–':fmt(v,autoDec(v))}
function inVal(v){return v==null||v===''?'':String(v).replace('.',',')}
function todayS(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dn(s){const [y,m,d]=s.split('-').map(Number);return Math.round(Date.UTC(y,m-1,d)/864e5)}
function ds(n){return new Date(n*864e5).toISOString().slice(0,10)}
function fd(s,long){if(!s)return '–';const [y,m,d]=s.split('-');return d+'.'+m+'.'+(long?y:y.slice(2))}
function relDays(s){const t=dn(todayS())-dn(s);return t===0?'heute':t===1?'gestern':t<0?'in '+(-t)+' Tagen':'vor '+t+' Tagen'}

 for(let v=Math.ceil(v0/step)*step;v<=v1+1e-9;v+=step){const yy=Y(v);doc.line(pl,yy,pl+pw,yy);doc.text(fmt(v,tdec),pl-1.2,yy+1,{align:'right'})}
 if(r){const yz=Y(r.ziel);if(yz>=pt&&yz<=pt+ph){doc.setDrawColor(...C.acc);doc.setLineWidth(0.2);doc.setLineDashPattern([1,1],0);doc.line(pl,yz,pl+pw,yz);doc.setLineDashPattern([],0)}}

 doc.setDrawColor(...C.acc);doc.setLineWidth(0.45);for(let i=1;i<pts.length;i++)doc.line(X(dn(pts[i-1].t)),Y(pts[i-1].v),X(dn(pts[i].t)),Y(pts[i].v));
 pts.forEach((p,i)=>{const s=status(p.v,r);const c=s==='crit'?C.crit:s==='warn'?C.warn:C.acc;doc.setFillColor(...c);doc.setDrawColor(...c);doc.circle(X(dn(p.t)),Y(p.v),i===pts.length-1?0.9:0.6,'F')});

function drawChart(el,pts,r,dec){
 if(!el)return;
 if(!pts.length){el.innerHTML='<p class="empty">Noch keine Werte für diesen Parameter.</p>';return}
 const W=Math.max(280,Math.round(el.clientWidth||640)),H=W<480?200:240,pl=52,pr=14,pt=12,pb=26;
 const ts=pts.map(p=>dn(p.t));let t0=Math.min(...ts),t1=Math.max(...ts);if(t1-t0<2){t0-=3;t1+=3}
 const vals=pts.map(p=>p.v);if(r){vals.push(r.min,r.max)}let v0=Math.min(...vals),v1=Math.max(...vals);if(v1-v0<1e-9){v0-=1;v1+=1}const pad=(v1-v0)*0.1;v0-=pad;v1+=pad;if(Math.min(...pts.map(p=>p.v))>=0&&v0<0&&(!r||r.min>=0))v0=Math.max(v0,0);
 const X=t=>pl+(t-t0)/(t1-t0)*(W-pl-pr),Y=v=>pt+(v1-v)/(v1-v0)*(H-pt-pb);
 const step=niceStep((v1-v0)/4),tdec=Math.max(0,-Math.floor(Math.log10(step)+1e-9));
 let g='';for(let v=Math.ceil(v0/step)*step;v<=v1+1e-9;v+=step){const y=Y(v).toFixed(1);g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${(+y+4).toFixed(1)}" text-anchor="end">${fmt(v,tdec)}</text>`}
 const nx=W<480?3:5;for(let i=0;i<nx;i++){const t=Math.round(t0+(t1-t0)*i/(nx-1));const x=X(t);g+=`<text x="${x.toFixed(1)}" y="${H-6}" text-anchor="${i===0?'start':i===nx-1?'end':'middle'}">${fd(ds(t))}</text>`}
 let band='';if(r){const yb=Math.max(pt,Y(r.max)),ya=Math.min(H-pb,Y(r.min));if(ya>yb)band=`<rect x="${pl}" y="${yb.toFixed(1)}" width="${W-pl-pr}" height="${(ya-yb).toFixed(1)}" fill="var(--band)"/>`;const yz=Y(r.ziel);if(yz>=pt&&yz<=H-pb)band+=`<line x1="${pl}" x2="${W-pr}" y1="${yz.toFixed(1)}" y2="${yz.toFixed(1)}" stroke="var(--actinic)" stroke-width="1" stroke-dasharray="4 4" opacity=".7"/>`}
 const path=pts.map((p,i)=>(i?'L':'M')+X(dn(p.t)).toFixed(1)+' '+Y(p.v).toFixed(1)).join(' ');
 const dots=pts.map((p,i)=>{const st=status(p.v,r);const c=st==='crit'?'var(--crit)':st==='warn'?'var(--warn)':'var(--actinic)';const last=i===pts.length-1;return `<circle cx="${X(dn(p.t)).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="${last?5:3.2}" fill="${last?c:'var(--surface)'}" stroke="${c}" stroke-width="2"><title>${fd(p.t,true)}: ${fmt(p.v,dec??autoDec(p.v))}</title></circle>`}).join('');
 const lp=pts[pts.length-1],lx=X(dn(lp.t)),ly=Y(lp.v);const lab=`<text x="${Math.min(lx,W-pr-2).toFixed(1)}" y="${(ly-10).toFixed(1)}" text-anchor="end" style="fill:var(--ink);font-weight:600">${fmt(lp.v,dec??autoDec(lp.v))}</text>`;
 el.innerHTML=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Verlaufsdiagramm">${band}${g}<path d="${path}" fill="none" stroke="var(--actinic)" stroke-width="2" stroke-linejoin="round"/>${dots}${lab}</svg>`;
}
function spark(pts,r){if(pts.length<2)return '';const p=pts.slice(-10);const W=100,H=28;const vs=p.map(x=>x.v);let a=Math.min(...vs),b=Math.max(...vs);if(b-a<1e-9){a-=1;b+=1}const X=i=>2+i/(p.length-1)*(W-4),Y=v=>3+(b-v)/(b-a)*(H-6);return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${p.map((x,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(x.v).toFixed(1)).join(' ')}" fill="none" stroke="var(--actinic)" stroke-width="1.6" vector-effect="non-scaling-stroke"/></svg>`}

/* ---------- Spurenelement-Bilanz (Logik aus Tristans Spurenelement-Rechner) ---------- */
function mixAt(day){let m=null;for(const x of mixes()){if(dn(x.gueltigAb)<=day)m=x;else break}return m}
function konzF(sym){const c=num(S.cfg.spuren.elemente[sym]?.konz);if(c==null)return null;return EMAP[sym]?.u==='mg/l'?c/1000:c} // Einheit·l pro ml
function zufuhrMix(m,sym,V){if(!m)return 0;const ml=num(m.ml?.[sym])||0;const F=konzF(sym);if(F==null||!num(m.ansatz))return 0;return ml/num(m.ansatz)*num(m.mlProTag)*F/V}
function spurenCalc(){
 const sp=S.cfg.spuren,V=num(S.cfg.volumen)||0,tage=num(sp.tage)||0,aus=(num(sp.ausgleich)??100)/100,rund=num(sp.rundung)||0.01,mlTag=num(sp.mlProTag)||0;
 const list=icps();const A=list.find(i=>i.id===S.ui.spA),B=list.find(i=>i.id===S.ui.spB);
 const out={A,B,V,tage,ansatz:mlTag*tage,rows:[],days:null,mixInfo:[]};
 if(!A||!B)return out;const a=dn(A.datum),b=dn(B.datum);out.days=b-a;
 const seen=new Set();for(let d=a;d<b;d++){const m=mixAt(d);const k=m?m.id:'-';if(!seen.has(k)){seen.add(k);out.mixInfo.push(m)}}
 for(const sym of Object.keys(sp.elemente)){
  const e=sp.elemente[sym];if(e.aktiv===false)continue;const F=konzF(sym);const soll=rng('e:'+sym).ziel;
  const H=num(A.werte?.[sym]),I=num(B.werte?.[sym]);const r={sym,stamm:e.stamm,F,soll,H,I,unit:EMAP[sym]?.u||'µg/l',note:'',crit:false};
  const mA=mixAt(a);r.bisher=mA?num(mA.ml?.[sym]):null;
  if(H==null){r.note='Kein Wert in der Ausgangsmessung'}else if(I==null){r.note='Kein Wert in der neuen Messung'}else if(!mA){r.note='Keine Mischung für das Ausgangsdatum in der Historie'}else if(F==null){r.note='Konzentration des Konzentrats fehlt'}else if(!(out.days>0)){r.note='Neue Messung muss nach der Ausgangsmessung liegen'}
  else{
   let sum=0;for(let d=a;d<b;d++)sum+=zufuhrMix(mixAt(d),sym,V);r.zufuhr=sum/out.days;
   r.aend=(I-H)/out.days;r.verbrauch=r.zufuhr-r.aend;r.bedarf=r.verbrauch+aus*(soll-I)/tage;
   r.exakt=Math.max(0,r.bedarf)*V*tage/F;const fk=num(S.ui.faktor[sym]??e.faktor)??1;r.faktor=fk;
   r.pip=Math.round(r.exakt*fk/rund)*rund;r.prog=I+(r.pip*F/(V*tage)-r.verbrauch)*tage;
   if(r.verbrauch<0){r.note='Verbrauch negativ: Wert stieg stärker als dosiert – Eintrag oder Messung prüfen';r.crit=true}
   else if(r.bedarf<0)r.note='Nicht dosieren – Wert sinkt durch Verbrauch Richtung Soll';
   else if(r.pip>0&&r.pip<0.1)r.note='Sehr kleine Menge: genau pipettieren oder Konzentrat vorverdünnen';
   if(sym==='Cu'&&r.prog>r.soll*1.25){r.note=(r.note?r.note+' · ':'')+'Kupfer: Ergebnis vor dem Ansetzen prüfen';r.crit=true}
  }
  out.rows.push(r);
 }
 return out;
}
function rundDec(){const r=num(S.cfg.spuren.rundung)||0.01;return Math.max(0,-Math.floor(Math.log10(r)+1e-9))}

/* ---------- Meerwasser-Formeln (EOS-80, PSS-78) ---------- */
const rhoW=t=>999.842594+6.793952e-2*t-9.095290e-3*t*t+1.001685e-4*t**3-1.120083e-6*t**4+6.536332e-9*t**5;
const rho=(S_,t)=>rhoW(t)+S_*(0.824493-4.0899e-3*t+7.6438e-5*t*t-8.2467e-7*t**3+5.3875e-9*t**4)+S_**1.5*(-5.72466e-3+1.0227e-4*t-1.6546e-6*t*t)+4.8314e-4*S_*S_;
function salFromC(C,t){const R=C/42.914,rt=0.6766097+2.00564e-2*t+1.104259e-4*t*t-6.9698e-7*t**3+1.0031e-9*t**4,Rt=R/rt,s=Math.sqrt(Math.max(Rt,0));const a=[0.008,-0.1692,25.3851,14.0941,-7.0261,2.7081],b=[0.0005,-0.0056,-0.0066,-0.0375,0.0636,-0.0144];let A=0,B=0;for(let i=0;i<6;i++){A+=a[i]*s**i;B+=b[i]*s**i}return A+(t-15)/(1+0.0162*(t-15))*B}
function bisect(f,lo,hi,target){for(let i=0;i<80;i++){const m=(lo+hi)/2;(f(m)<target)?lo=m:hi=m}return (lo+hi)/2}
const sg=S_=>rho(S_,25)/rhoW(25);

TABS.icp={

  </section>

   <div class="form-grid" style="margin-top:12px">

    <div class="actions"><button class="btn primary" data-act="mixsave">Als angesetzte Mischung speichern</button><span class="sub" style="color:var(--muted);font-size:.85rem">Weicht deine tatsächliche Mischung ab, kannst du sie danach in der Historie korrigieren.</span></div>
   </div></section>
  <section class="panel"><div class="ph"><h2>Mischungshistorie</h2><button class="btn small" data-act="mixnew">Mischung manuell eintragen</button></div><div id="mx-edit"></div><div id="mx-list"></div>
   <p class="hint">Der Rechner nimmt für jeden Tag die letzte Mischung, deren „gültig ab“ am oder vor diesem Tag liegt. ml = Konzentrat im gesamten Ansatz.</p></section>
  <section class="panel"><div class="ph"><h2>Konzentrate</h2><span class="sub">Konzentration laut Hersteller in mg/l (= µg/ml)</span></div><div id="kz"></div>
   <div class="form-grid" style="margin-top:12px"><label class="f" for="kz-add"><span>Element hinzufügen</span><select id="kz-add"></select></label><div class="actions" style="grid-column:auto;align-self:end"><button class="btn" data-act="kzadd">Hinzufügen</button></div></div>
  </section></div>`},
 update(){

   ${mx.slice().reverse().map(m=>{const ro=st=>num(m.ansatz)-syms.filter(s=>S.cfg.spuren.elemente[s].stamm===st).reduce((a,s)=>a+(num(m.ml?.[s])||0),0);const tg=num(m.ansatz)/num(m.mlProTag);
    return `<tr><td>${fd(m.gueltigAb,true)}</td><td>${fmt(num(m.ansatz),0)}</td><td>${fmt(num(m.mlProTag),1)}</td><td>${isFinite(tg)?fmt(tg,0)+' T.':'–'}</td>${syms.map(s=>`<td>${num(m.ml?.[s])==null?'–':fmt(num(m.ml[s]),2)}</td>`).join('')}<td>${fmt(ro('K'),1)}</td><td>${fmt(ro('A'),1)}</td><td class="txt">${esc(m.bemerkung||'')}</td>
    <td>${S.canWrite?(S.ui.confirm===m.id?`<button class="btn small danger" data-act="mxdel" data-id="${m.id}">Löschen bestätigen</button> <button class="btn small" data-act="nocf">Nein</button>`:`<button class="btn small" data-act="mxedit" data-id="${m.id}">Bearbeiten</button> <button class="btn small" data-act="cf" data-id="${m.id}">Löschen</button>`):''}</td></tr>`}).join('')}</tbody></table></div>`:'<p class="empty">Noch keine Mischung gespeichert.</p>';
  const els=S.cfg.spuren.elemente;
  if(!$('#kz').contains(document.activeElement))$('#kz').innerHTML=`<div class="tw"><table><thead><tr><th>Element</th><th class="txt">Lösung</th><th>Konzentration mg/l</th><th>Soll</th><th class="txt">Berechnen</th></tr></thead><tbody>${syms.map(s=>`<tr><td>${EMAP[s]?.n||s} (${s})</td>
   <td class="txt"><select data-stamm="${s}" style="width:auto">${['K','A'].map(x=>`<option value="${x}"${els[s].stamm===x?' selected':''}>${x==='K'?'K+ (Kationen)':'A− (Anionen)'}</option>`).join('')}</select></td>
   <td><input class="num" inputmode="decimal" data-cfg="spuren.elemente.${s}.konz" data-num="1" value="${esc(inVal(els[s].konz))}" style="width:110px"></td>
   <td>${fmtA(rng('e:'+s).ziel)} ${EMAP[s]?.u||''}</td><td class="txt"><label><input type="checkbox" data-aktiv="${s}"${els[s].aktiv===false?'':' checked'}> ja</label></td></tr>`).join('')}</tbody></table></div>
   <p class="hint">Sollwerte änderst du unter „Zielwerte“. Osci-Motion-Konzentrationen aus deinem Spurenelement-Rechner (Herstellerseiten, abgerufen 28.09.2026).</p>`;
  $('#kz-add').innerHTML=EL.filter(e=>!els[e.s]).map(e=>`<option value="${e.s}">${e.n} (${e.s})</option>`).join('');
 },
 updateCalcOnly(){
  const c=spurenCalc();const dec=rundDec();
  const mi=c.mixInfo.filter(Boolean);
  $('#sp-info').innerHTML=c.A&&c.B?`<dt>Tage zwischen den Messungen</dt><dd>${c.days}</dd><dt>Dosierte Mischung im Zeitraum</dt><dd>${mi.length?mi.map(m=>'ab '+fd(m.gueltigAb,true)+' ('+fmt(num(m.ansatz),0)+' ml, '+fmt(num(m.mlProTag),1)+' ml/Tag)').join(' · '):'keine'}</dd><dt>Neuer Ansatz je Lösung</dt><dd>${fmt(c.ansatz,0)} ml für ${fmt(c.tage,0)} Tage</dd>`:'';
  if(!c.A||!c.B||c.A===c.B){$('#sp-table').innerHTML='<p class="empty">Für die Berechnung brauchst du zwei ICP-Analysen: eine Ausgangsmessung und eine neue Messung.</p>';this.mix(c);return}
  $('#sp-table').innerHTML=`<div class="tw"><table><thead><tr><th>Element</th><th>Lsg.</th><th>Soll</th><th>Ausgang</th><th>Messwert</th><th>Bisher ml</th><th>Zufuhr /Tag</th><th>Änderung /Tag</th><th>Verbrauch /Tag</th><th>Bedarf /Tag</th><th>Neu ml exakt</th><th>Faktor</th><th>Neu ml pipettieren</th><th>Prognose</th><th class="txt">Hinweis</th></tr></thead><tbody>
  ${c.rows.map(r=>{const has=r.exakt!=null;const rr=rng('e:'+r.sym);return `<tr><td>${EMAP[r.sym]?.n||r.sym} (${r.sym})</td><td>${r.stamm==='K'?'K+':'A−'}</td><td>${fmtA(r.soll)}</td><td>${fmtA(r.H)}</td><td>${fmtA(r.I)}${dot(r.I,rr)}</td><td>${r.bisher==null?'–':fmt(r.bisher,2)}</td>
   <td>${has?fmtA(r.zufuhr):'–'}</td><td>${has?(r.aend>=0?'+':'−')+fmtA(Math.abs(r.aend)):'–'}</td><td>${has?fmtA(r.verbrauch):'–'}</td><td>${has?fmtA(r.bedarf):'–'}</td><td>${has?fmt(r.exakt,3):'–'}</td>
   <td><input class="num" inputmode="decimal" data-faktor="${r.sym}" value="${esc(inVal(S.ui.faktor[r.sym]??S.cfg.spuren.elemente[r.sym]?.faktor??1))}" style="width:64px"></td>
   <td class="hl">${has?fmt(r.pip,dec):'–'}</td><td>${has?fmtA(r.prog)+dot(r.prog,rr):'–'}</td><td class="note${r.crit?' crit':''}">${esc(r.note)}</td></tr>`}).join('')}</tbody></table></div>
   <p class="hint">Einheiten je Liter Beckenwasser: µg/l bzw. mg/l (Fluor). Prognose = Messwert + (neue Zufuhr − Verbrauch) × Tage.</p>`;
  this.mix(c);
 },
 mix(c){const dec=rundDec();const ok=c.rows.some(r=>r.pip!=null);
  if(!ok){$('#mz').innerHTML='<p class="empty">Der Mischzettel erscheint, sobald die Berechnung oben Ergebnisse hat.</p>';$('#mz-sub').textContent='';return}
  const col=st=>{const rs=c.rows.filter(r=>r.stamm===st);const sum=rs.reduce((a,r)=>a+(r.pip||0),0);const ro=c.ansatz-sum;
   return `<div class="mixcol"><h3><span>${st==='K'?'Lösung K+ (Kationen)':'Lösung A− (Anionen)'}</span><span class="mono" style="font-size:.85rem;color:var(--muted)">ml</span></h3>
   ${rs.map(r=>`<div class="mixrow"><span>${EMAP[r.sym]?.n||r.sym} (${r.sym})</span><span class="mono">${r.pip==null?'–':fmt(r.pip,dec)}</span></div>`).join('')}
   <div class="mixrow ro"><span>Osmosewasser auffüllen</span><span class="mono">${fmt(ro,dec)}</span></div><div class="mixrow sum"><span>Gesamt</span><span class="mono">${fmt(c.ansatz,dec)}</span></div>
   ${ro<0?'<p class="note crit" style="margin:8px 0 0">Konzentrate übersteigen das Ansatzvolumen – ml pro Tag erhöhen.</p>':''}</div>`};
  $('#mz').innerHTML=`<div class="mix">${col('K')}${col('A')}</div><p class="hint">Täglich je Lösung ${fmt(num(S.cfg.spuren.mlProTag),1)} ml dosieren.</p>`;
  const d=S.ui.mixDatum||todayS();$('#mz-sub').textContent='reicht bis '+fd(ds(dn(d)+Math.floor(c.tage)),true);
 }
};

/* ---------- KH · Ca · Mg ---------- */
function dosCalc(k){const c=S.cfg.dos[k],V=num(S.cfg.volumen)||0;const prod=PRODUKTE[k].find(p=>p.id===c.produkt)||PRODUKTE[k][0];
 const eigen=prod.id==='eigen',gpl=num(c.gpl);const unit=eigen||(gpl>0)?'ml':'g';
 const eff100=eigen?num(c.wirkung):(gpl>0?prod.e*gpl/1000:prod.e);const inc=eff100!=null&&V?eff100*100/V:null;
 const se=series(k);const T=dn(todayS());const win=num(c.fenster)||30;const pts=se.filter(p=>dn(p.t)>=T-win).map(p=>({x:dn(p.t),y:p.v}));
 const slope=regression(pts);const dose=num(c.tagesdosis)||0;const supply=inc!=null?dose*inc:null;
 const cons=slope!=null&&supply!=null?supply-slope:null;const last=se[se.length-1];const r=rng('p:'+k);
 const kt=num(c.korrektur)||7;let corr=last?(r.ziel-last.v)/kt:null;const mx=MAXTAG[k];if(corr!=null)corr=Math.max(-mx,Math.min(mx,corr));
 const recInc=cons!=null&&corr!=null?Math.max(0,cons+corr):null;const rec=recInc!=null&&inc?recInc/inc:null;
 let once=null;if(last&&inc&&r.ziel>last.v){const diff=r.ziel-last.v;const days=Math.max(1,Math.ceil(diff/mx));once={amount:diff/inc,days,per:diff/inc/days}}
 return{prod,unit,inc,eff100,pts,slope,supply,cons,last,r,rec,recInc,once,kt,win,dose}}
TABS.dosierung={

TABS.rechner={
 build(){const c=S.ui.conv,a=S.ui.adj;return `<div class="grid2">

  </div><div class="res" id="ad-res"></div><p class="hint">Rechnet mit dem Systemvolumen netto. Salz für 35 ‰ hängt vom Salz ab – Herstellerangabe eintragen.</p></section>

  const a=S.ui.adj,V=num(S.cfg.volumen),ls=series('sal');const ist=num(a.ist)??(ls.length?ls[ls.length-1].v:null),soll=num(a.soll),g35=num(S.cfg.salz.gpl35);
  let h='<div><span>Ergebnis</span><b>–</b></div>';

   else if(soll>ist&&g35){const g=V*g35*(soll-ist)/35;h=`<div class="big"><span>Anheben: Salz zugeben (vorher auflösen)</span><b>${fmt(g/1000,2)}</b> <small>kg</small></div><div><span>oder in Gramm</span><b>${fmt(g,0)}</b> <small>g</small></div>`}

 }

};
Object.assign(ACTIONS,{
 pdf:async(a)=>{a.disabled=true;a.textContent='PDF wird erstellt …';try{const blob=await buildPdf();await saveFile('riff-logbuch-bericht-'+todayS()+'.pdf',blob)}catch(e){toast(e.message||'PDF konnte nicht erstellt werden')}finally{a.disabled=false;a.textContent='PDF erstellen'}},
 bkfile:()=>backupFile(),bkcopy:()=>backupCopy(),excsv:(a,id)=>exportCsv(id),
 rstext:()=>{const t=$('#rs-text').value.trim();if(!t){toast('Bitte zuerst die Sicherung einfügen');return}if($('#rs-ersetzen').checked){S.ui.pending=t;S.ui.confirm='ersetzen';showTab('speichern');return}restoreText(t,false);$('#rs-text').value=''},
 rsgo:()=>{const t=S.ui.pending;S.ui.pending=null;S.ui.confirm=null;if(t)restoreText(t,true);showTab('speichern')},
 cfwipe:()=>{S.ui.confirm='alles';showTab('speichern')},
 wipe:()=>{S.data=emptyData();S.ui.confirm=null;applyConfig();changed();showTab('speichern');toast('Alle Daten auf diesem Gerät gelöscht')},
 ovrange:(a,id)=>{S.ui.range=+id;TABS.uebersicht.update()}
});
document.addEventListener('change',async e=>{const el=e.target;if(el.dataset.pdf){S.ui.pdf[el.dataset.pdf]=el.checked;return}
 if(el.id==='rs-file'&&el.files?.[0]){const t=await el.files[0].text();el.value='';if($('#rs-ersetzen').checked){S.ui.pending=t;S.ui.confirm='ersetzen';showTab('speichern')}else restoreText(t,false)}});

/* ---------- Start ---------- */
async function init(){
 S.data=await loadData();applyConfig();updateHeader();showTab(S.tab);renderSync();
 try{if(navigator.storage?.persisted){S.persist=await navigator.storage.persisted();renderSync()}}catch(e){}
 if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
}
init();

</script>
</body>
</html>
